[project]
name = "jobstats"
version = "0.1.0"
description = "Jobstats scripts and modules"
readme = "README.md"
requires-python = "==3.9.*"
dependencies = [
    "blessed",
    "requests",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project.scripts]
jobstats = "jobstats.cli:jobstats_main"
store_jobstats = "jobstats.cli:store_jobstats_main"

[dependency-groups]
dev = [
  "tox",
  "tox-uv",
  "pytest>=7.0",
  "pytest-cov",
  "setuptools<54.0",
  "prospector",
  "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
]
