[project]
name = "jobstats"
version = "0.1.0"
description = "Jobstats scripts and modules"
readme = "README.md"
requires-python = "==3.9"
dependencies = [
    "blessed",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project.scripts]
jobstats = "jobstats.cli.jobstats:main"
store_jobstats = "jobstats.cli.store_jobstats:main"
